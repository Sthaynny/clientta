name: clientta
description: "Clientta — CRM de agendamentos para consultores, offline no celular."
publish_to: "none"

version: 1.3.0+11

environment:
  sdk: ^3.7.0

dependencies:
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.1.0
  cupertino_icons: ^1.0.8
  design_system:
    path: ../design_system/ds
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  logging: ^1.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  patrol: ^3.14.1
  patrol_finders: ^2.7.0

patrol:
  app_name: Clientta
  android:
    package_name: br.com.sthaynny.clientta
  ios:
    bundle_id: br.com.sthaynny.clientta

flutter:
  uses-material-design: true
  assets:
    - assets/images/
