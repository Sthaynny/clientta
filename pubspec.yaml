name: clientta
description: "Clientta — CRM de agendamentos para consultores, offline no celular."
publish_to: "none"

version: 1.4.0+12

environment:
  sdk: ^3.7.0

dependencies:
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.1.0
  cupertino_icons: ^1.0.8
  design_system:
    path: ../design_system/ds
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  google_sign_in: ^6.2.2
  flutter:
    sdk: flutter
  get_it: ^8.0.3
  logging: ^1.3.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  share_plus: ^12.0.2
  file_picker: ^11.0.3
  shimmer: ^3.0.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
